name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label without v (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          $env:CI = "1"
          .\scripts\build.bat

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "${{ inputs.version }}"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Pack zip
        shell: pwsh
        run: .\scripts\pack-release.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorWidget-Windows-v${{ steps.ver.outputs.version }}
          path: release/CursorWidget-Windows-v${{ steps.ver.outputs.version }}.zip

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Cursor Widget ${{ steps.ver.outputs.tag }}
          body: |
            ## Cursor Pro+ Glass Desktop Widget

            ### Install (Windows)
            1. Download **CursorWidget-Windows-v${{ steps.ver.outputs.version }}.zip**
            2. Unzip anywhere
            3. Run **Start Cursor Widget.bat** (or `CursorWidget.exe`)
            4. Be signed into Cursor IDE on this PC

            See the README for SmartScreen notes and troubleshooting.
          files: release/CursorWidget-Windows-v${{ steps.ver.outputs.version }}.zip
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
